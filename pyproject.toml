[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deadline-cloud-for-blender"
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
description = "AWS Deadline Cloud for Blender"
authors = [
  {name = "Amazon Web Services"},
]
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
]
# Blender 2.9 uses Python version 3.9
# Blender 3.1-4.0 uses Python version 3.10
# Blender 4.1-5.0 uses Python version 3.11
# Blender 5.1+ uses Python version 3.13

dependencies = [
    # BaseSubmitter/BaseSubmitterSettings (the unified submitter contract this
    # package builds on) first ship in deadline 0.60.2; 0.60.0/0.60.1 lack them
    # and would fail at import. Floor must be 0.60.2.
    "deadline >= 0.60.2,< 0.61",
    "openjd-adaptor-runtime >= 0.7,< 0.10",
]

[project.optional-dependencies]
gui = [
    "deadline[gui] >= 0.60.2,< 0.61",
]

[project.urls]
Homepage = "https://github.com/aws-deadline/deadline-cloud-for-blender"
Source = "https://github.com/aws-deadline/deadline-cloud-for-blender"

[project.scripts]
blender-openjd = "deadline.blender_adaptor.BlenderAdaptor:main"
# The binary name 'BlenderAdaptor' is deprecated.
BlenderAdaptor = "deadline.blender_adaptor.BlenderAdaptor:main"

# --- HATCH ---

[tool.hatch.build]
artifacts = ["*_version.py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_custom_hook.py"
blender_addon_init = "src/deadline/blender_submitter/addons/deadline_cloud_blender_submitter/__init__.py"

[tool.hatch.build.hooks.custom.copy_version_py]
destinations = [
  "src/deadline/blender_adaptor",
  "src/deadline/blender_submitter",
  "src/deadline/blender_submitter/addons/deadline_cloud_blender_submitter",
]

[tool.hatch.build.targets.sdist]
include = ["src/*", "hatch_custom_hook.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/deadline"]

# --- MYPY ---

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
show_error_codes = true
pretty = true
files = ["src/**/*.py"]
ignore_missing_imports = true
# Tell mypy that there's a namespace package at src/deadline
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bpy.*", "qtpy.*", "PyOpenColorIO.*"]

# --- RUFF / BLACK ---

[tool.ruff]
line-length = 100
exclude = [".kiro"]

[tool.ruff.lint]
ignore = [
    "E501",
    # Rules newly enforced in ruff 0.16 - suppress for Python 3.9 compat or intentional patterns
    "B008",      # function-call-in-default-argument
    "BLE001",    # blind-except (intentional broad catch)
    "FA100",     # future-annotations-import (47 files)
    "I001",      # unsorted-imports (36 files - conflicts with isort config)
    "PLR1704",   # redefined-argument-from-local
    "RUF012",    # mutable-class-default
    "SIM113",    # enumerate-for-loop
    "SIM117",    # multiple-with-statements (Python 3.9 compat)
    "TRY002",    # raise-vanilla-class (scripts)
    "UP006",     # non-pep585-annotation (Python 3.9 compat)
    "UP035",     # deprecated-import (Python 3.9 compat)
    "UP045",     # non-pep604-annotation (Python 3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["deadline"]

[tool.black]
line-length = 100

# --- PYTEST ---

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
  "--durations=5",
  "--cov=src/deadline/blender_adaptor",
  "--cov=src/deadline/blender_submitter",
  "--color=yes",
  "--cov-report=html:build/coverage",
  "--cov-report=xml:build/coverage/coverage.xml",
  "--cov-report=term-missing",
  "--numprocesses=auto",
]
testpaths = ["test"]
looponfailroots = ["src", "test"]
# looponfailroots is deprecated, this removes the deprecation from the test output
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "submitter: mark a test as using the submitter.",
    "adaptor: mark test as using the adaptor.",
    "scene_files: used to mark which scene files a test uses.",
    "gpu: used to mark a test that requires a gpu.",
]

# --- COVERAGE ---

[tool.coverage.run]
source_pkgs = [
  "deadline/blender_adaptor",
  "deadline/blender_submitter",
]
branch = true
parallel = true
omit = [
  "**/__main__.py",
  "**/_version.py",
]


[tool.coverage.paths]
source = ["src/"]

[tool.coverage.report]
show_missing = true
fail_under = 24

[tool.semantic_release]
# Can be removed or set to true once we are v1
major_on_zero = false
tag_format = "{version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = []
patch_tags = [
  "chore",
  "feat",
  "fix",
  "refactor",
  "perf",
]

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.changelog]
template_dir = ".semantic_release"

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.branches.release]
match = "(mainline|release|patch_.*)"
